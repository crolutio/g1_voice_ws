stt_node:
  ros__parameters:
    model_size: large-v3-turbo  # Whisper: large-v3-turbo (most accurate), small.en (faster, less GPU memory)
    device: cuda
    compute_type: float16
    language: en
    mic_device: default       # ALSA device for arecord, e.g. "default" or "plughw:1,6"
    recorder: arecord         # program that records the microphone (scripts/fake_microphone.py plays test speech)
    min_rms: 0.01             # lowest level that can count as speech
    threshold_ratio: 2.5      # speech must be this many times louder than the noise floor (see /voice/mic_level)
    unmute_delay_s: 0.5
    end_silence_ms: 700       # this much silence ends a sentence (900 hears slightly better in loud noise, answers 0.2 s later)
    # Saying a wake word starts a conversation: from then on everything is answered without the wake word,
    # until you say goodbye ("goodbye", "stop listening", "that's all", "go to sleep", ...). Outside a
    # conversation, speech is ignored. "Robot" is recognised most reliably. Use [""] to answer everything.
    wake_words: ["robot", "r1", "r one", "are one"]
    wake_word_sound_alikes: ["robert"]  # what Whisper sometimes writes for "robot"; only at the start of a sentence
    conversation_idle_timeout_s: 0.0  # 0 = a conversation lasts until you end it; e.g. 300 = ends after 5 quiet minutes
    wake_word_wait_s: 3.0     # after the wake word alone ("Robot..."), wait this long for the question, then greet
    # Names Whisper should expect (given to it as a prompt), so it writes "Aideology" and not "ideology"
    vocabulary: ["Aideology", "Jorge Colotto", "Dubai Silicon Oasis", "MDS"]
    beam_size: 5

brain_node:
  ros__parameters:
    # Language model: Groq in the cloud (needs the GROQ_API_KEY environment variable), and a local
    # Ollama model that answers when Groq is unavailable (no internet, no key, rate limit).
    use_groq: true
    groq_model: qwen/qwen3.8-27b   # or openai/gpt-oss-120b; see README "Choosing the Groq model"
    fallback_model: llama3.1:8b
    ollama_url: http://localhost:11434
    robot_name: R1
    history_turns: 10         # how many earlier question/answer pairs it remembers word for word
    # Qwen3-Embedding: knowledge base search, long-term memory and command matching.
    use_embeddings: true
    embedding_model: Qwen/Qwen3-Embedding-0.6B
    embedding_device: cuda
    knowledge_dir: ""         # "" = the package's config/knowledge folder; every .md/.txt file in it is searched
    knowledge_min_score: 0.40
    use_memory: true          # remember earlier conversations (stored in memory_file)
    memory_file: ~/.local/share/robot_voice_assistant/memory.jsonl
    memory_min_score: 0.40
    command_match_threshold: 0.68  # higher = only very clear commands are recognised without the language model

tts_node:
  ros__parameters:
    # riva: NVIDIA Riva voice in NVIDIA's cloud (needs the NVIDIA_API_KEY environment variable; the reply text
    # is sent to NVIDIA), falling back to Qwen3-TTS when unreachable or without a key;
    # qwen3: Qwen3-TTS on this computer; piper: very fast, more robotic
    tts_engine: riva
    riva_voice: Magpie-Multilingual.EN-US.Jason.Happy   # list voices: see README "NVIDIA Riva voices"
    riva_language: en-US
    riva_sample_rate: 44100
    riva_speaking_rate: 0.9   # Jason.Happy speaks about 195 words/min; 0.9 gives about 178 (same pitch)
    qwen_model: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    speaker: ryan             # aiden, dylan, eric, ryan (English); ono_anna, serena, sohee, uncle_fu, vivian
    language: english
    instruct: ""              # style instruction, e.g. "Speak in a warm, friendly tone."
    fast_decoding: true       # Qwen3-TTS about twice as fast (CUDA graph); false = the library's own decoding
    player: aplay
    speaking_rate: 1.1        # 1.0 = the voice's own pace, 1.1 = normal conversation, 1.2 = brisk (same pitch)

gesture_node:
  ros__parameters:
    rate_hz: 50.0
    command_topic: /robot/joint_command
